# Serves the built React app and proxies the API onto the backend.
#
# Putting both behind one origin is what lets the frontend use relative URLs:
# no API hostname baked into the bundle at build time, and no CORS anywhere in
# the system. It also means the browser never needs to reach any container
# except this one.

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Nothing here reveals anything useful except the version being run.
    server_tokens off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # ----------------------------------------------------------------------
    # API
    # ----------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:5000/api/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx defaults this to 1 MB, which would reject most photographs
        # with a 413 before the request ever reached the backend -- and the
        # backend's own 10 MB limit would look like it was being ignored.
        # Slightly above that limit, so the API is the component that decides.
        client_max_body_size 12m;

        # Uploads pass through this buffer on the way to the backend; sized to
        # match so a large image is streamed rather than spooled to disk.
        client_body_buffer_size 1m;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ----------------------------------------------------------------------
    # Static assets
    # ----------------------------------------------------------------------

    # Vite fingerprints these filenames with a content hash, so a changed file
    # is a changed URL and the old one can safely be cached forever.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # The entry point must never be cached: its whole job is to point at the
    # current hashed bundle, and a stale copy pins the browser to a deployment
    # whose assets may no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Client-side routing: /history is a React route, not a file on disk, so
    # unmatched paths fall through to the app rather than to a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
